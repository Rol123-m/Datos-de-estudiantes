<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner Sheet Board -->
  <g filter="url(#shadow)">
    <rect x="96" y="80" width="320" height="352" rx="28" fill="url(#cardGrad)"/>
    
    <!-- Top header bar on clipboard -->
    <rect x="96" y="80" width="320" height="76" rx="28" fill="#10b981"/>
    <rect x="96" y="130" width="320" height="26" fill="#10b981"/>

    <!-- Grid lines resembling Google Sheets / Student table -->
    <line x1="96" y1="210" x2="416" y2="210" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="96" y1="270" x2="416" y2="270" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="96" y1="330" x2="416" y2="330" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="96" y1="390" x2="416" y2="390" stroke="#e2e8f0" stroke-width="3"/>

    <!-- Columns -->
    <line x1="160" y1="156" x2="160" y2="432" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="310" y1="156" x2="310" y2="432" stroke="#e2e8f0" stroke-width="3"/>

    <!-- Graduation cap badge / icon over top-right -->
    <circle cx="360" cy="118" r="28" fill="#ffffff" filter="url(#shadow)"/>
    <path d="M360 102 L380 114 L360 126 L340 114 Z" fill="#2563eb"/>
    <path d="M348 120.8 V130 C348 134 372 134 372 130 V120.8" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <circle cx="380" cy="122" r="2.5" fill="#f59e0b"/>

    <!-- Student Avatar indicators in cells -->
    <circle cx="128" cy="183" r="14" fill="#3b82f6" opacity="0.8"/>
    <circle cx="128" cy="240" r="14" fill="#10b981" opacity="0.8"/>
    <circle cx="128" cy="300" r="14" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="128" cy="360" r="14" fill="#f59e0b" opacity="0.8"/>

    <!-- Student names representation bars -->
    <rect x="180" y="176" width="105" height="14" rx="7" fill="#64748b"/>
    <rect x="180" y="233" width="90" height="14" rx="7" fill="#64748b"/>
    <rect x="180" y="293" width="115" height="14" rx="7" fill="#64748b"/>
    <rect x="180" y="353" width="80" height="14" rx="7" fill="#64748b"/>

    <!-- Grade / Check badges in 3rd col -->
    <rect x="335" y="174" width="58" height="18" rx="9" fill="#dcfce7"/>
    <text x="364" y="187" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">10.0</text>

    <rect x="335" y="231" width="58" height="18" rx="9" fill="#dbeafe"/>
    <text x="364" y="244" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">9.5</text>

    <rect x="335" y="291" width="58" height="18" rx="9" fill="#fef3c7"/>
    <text x="364" y="304" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">8.8</text>

    <rect x="335" y="351" width="58" height="18" rx="9" fill="#dcfce7"/>
    <text x="364" y="364" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">9.2</text>
  </g>
</svg>
